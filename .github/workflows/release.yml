name: Release to Chrome Web Store

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      publish:
        description: Submit for review after uploading
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: chrome-web-store
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: chrome-web-store
      url: https://chromewebstore.google.com/detail/${{ vars.CWS_EXTENSION_ID }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify tag matches package version
        if: github.ref_type == 'tag'
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi
      - name: Verify
        run: |
          npm run format:check
          npm run check
          npm test
      - name: Build and package
        run: |
          npm run build
          npm run package
          echo "ARCHIVE=$(ls release/*.zip)" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: audiorack-extension
          path: ${{ env.ARCHIVE }}
      - name: Upload to Chrome Web Store
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          CWS_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == false && 'false' || 'true' }}
        run: bash scripts/cws-publish.sh "$ARCHIVE"
      - name: Create GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$ARCHIVE" --title "$GITHUB_REF_NAME" --generate-notes
