<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>AudioRack side panel scene</title>
        <link rel="stylesheet" href="promo.css" />
        <style>
            body {
                display: flex;
                width: 100vw;
                height: 100vh;
            }

            .page {
                display: flex;
                flex: 1;
                flex-direction: column;
                gap: 18px;
                min-width: 0;
                padding: 28px 32px;
            }

            .player {
                position: relative;
                overflow: hidden;
                flex: none;
                aspect-ratio: 16 / 9;
                max-height: 62%;
                border-radius: 14px;
                background:
                    radial-gradient(circle at 30% 35%, rgb(255 94 122 / 45%), transparent 55%),
                    radial-gradient(circle at 75% 70%, rgb(79 179 255 / 40%), transparent 55%),
                    linear-gradient(160deg, #1d1530, #0b1424);
            }

            .player .bars {
                position: absolute;
                inset: auto 8% 16%;
                display: flex;
                align-items: flex-end;
                gap: 6px;
                height: 38%;
            }

            .player .bars span {
                flex: 1;
                border-radius: 3px 3px 0 0;
                background: linear-gradient(#ffb347, #ff5e7a);
                opacity: 0.75;
            }

            .player .progress {
                position: absolute;
                inset: auto 16px 14px;
                height: 4px;
                border-radius: 2px;
                background: rgb(255 255 255 / 25%);
            }

            .player .progress::before {
                content: '';
                display: block;
                width: 38%;
                height: 100%;
                border-radius: 2px;
                background: #ff5e7a;
            }

            .title {
                margin: 0;
                font-size: 22px;
                font-weight: 600;
            }

            .meta {
                margin: -10px 0 0;
                color: #8b95a5;
                font-size: 14px;
            }

            .lines {
                display: flex;
                flex-direction: column;
                gap: 10px;
            }

            .lines span {
                height: 10px;
                border-radius: 5px;
                background: rgb(255 255 255 / 7%);
            }

            .dock {
                display: flex;
                flex: none;
                flex-direction: column;
                width: 820px;
                border-left: 1px solid rgb(255 255 255 / 12%);
                background: #0e1014;
                box-shadow: -12px 0 32px rgb(0 0 0 / 35%);
            }

            .dock-bar {
                display: flex;
                align-items: center;
                gap: 8px;
                height: 36px;
                padding: 0 12px;
                border-bottom: 1px solid rgb(255 255 255 / 8%);
                color: #c9d1dc;
                font-size: 13px;
            }

            .dock-bar img {
                width: 16px;
                height: 16px;
            }

            iframe {
                flex: 1;
                width: 100%;
                border: 0;
            }
        </style>
    </head>
    <body>
        <section class="page">
            <div class="player">
                <div class="bars" aria-hidden="true"></div>
                <div class="progress"></div>
            </div>
            <h1 class="title">Late-night drum &amp; bass mix</h1>
            <p class="meta">1:12:40 · streamed live</p>
            <div class="lines" aria-hidden="true">
                <span style="width: 92%"></span>
                <span style="width: 84%"></span>
                <span style="width: 66%"></span>
            </div>
        </section>
        <aside class="dock">
            <div class="dock-bar">
                <img src="../../public/icons/icon-32.png" alt="" />
                <span>AudioRack</span>
            </div>
            <iframe src="../../rack.html?panel=side" title="AudioRack side panel"></iframe>
        </aside>
        <script>
            const heights = [38, 62, 80, 54, 92, 70, 44, 66, 100, 76, 58, 84, 48, 30, 56, 72, 40];
            document.querySelector('.bars').append(
                ...heights.map((height) => {
                    const bar = document.createElement('span');
                    bar.style.height = `${height}%`;
                    return bar;
                }),
            );
        </script>
    </body>
</html>
